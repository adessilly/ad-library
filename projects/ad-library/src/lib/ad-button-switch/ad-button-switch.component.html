@if (theme === 'flip') {
  <div
    class="flip-button"
    (click)="switchValue()"
    [ngClass]="{'clicked': ngValue}">
    <div class="flip-button-inner">
      <div class="flip-button-front">
        @if (iconOff) {
          <i [class]="iconOff" style="margin-right:3px;"></i>
          }{{ labelOff }}
        </div>
        <div class="flip-button-back">
          @if (iconOn) {
            <i [class]="iconOn" style="margin-right:3px;"></i>
            }{{ labelOn }}
          </div>
        </div>
      </div>
    }

    @if (theme === 'switch') {
      <div class="switch-button">
        <label class="switch-button-label" [class.switch-button-checked]="input && input.checked">
          <input
            type="checkbox"
            class="switch-button-checkbox"
            [ngModel]="ngValue"
            (ngModelChange)="switchValue()"
            #input>
        </label>
      </div>
    }
